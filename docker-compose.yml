services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DEVPILOT_POSTGRES_DB:-devpilot}
      POSTGRES_USER: ${DEVPILOT_POSTGRES_USER:-devpilot}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - devpilot-postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DEVPILOT_ENV: production
      DEVPILOT_DATABASE_URL: postgresql+psycopg://devpilot@database:5432/devpilot
      DEVPILOT_AUTH_SECRET_FILE: /run/secrets/devpilot_auth_secret
      DEVPILOT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - devpilot_auth_secret
      - postgres_password
    restart: unless-stopped

secrets:
  devpilot_auth_secret:
    file: ./deploy/secrets/devpilot_auth_secret
  postgres_password:
    file: ./deploy/secrets/postgres_password

volumes:
  devpilot-postgres:
