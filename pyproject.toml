[project]
name = "devpilot"
version = "0.1.0rc1"
description = "A local-first multi-agent development assistant."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "langchain-anthropic>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "langgraph>=0.6,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "rich>=13.9,<14",
    "sqlalchemy>=2.0,<3",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
devpilot = "apps.cli.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]
